name: Test code and app
on:
  pull_request:
    paths:
      - lightstream/**
      - tests/**
      - pyproject.toml
      - .github/workflows/run_test.yaml
jobs:
  test_natten:
    # NATTEN's pinned production revision builds CUDA extensions and cannot be
    # meaningfully validated on GitHub's CPU-only hosted runners.
    name: Production NAT parity (real NATTEN backend)
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lightstream with NATTEN
        run: python -m pip install pytest --editable '.[nat]'

      - name: Run neighborhood attention tests (skips are reported)
        env:
          # Turns the local import-or-skip behavior into a hard CI guard. This
          # also verifies that the runner exposes the CUDA environment for
          # which the pinned production backend was built.
          LIGHTSTREAM_REQUIRE_NATTEN: "1"
        run: python -m pytest -ra tests/test_streamingneighborhoodattention.py

  test_model:
    name: CPU test suite (optional NATTEN tests may skip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        id: checkout
        uses: actions/checkout@v2

      - name: Environment setup
        uses: actions/setup-python@v2
        with:
          python-version: 3.8

      - name: Install Poetry
        uses: snok/install-poetry@v1
        
      - name: Install packages
        run: poetry install

      - name: Run tests
        run: poetry run pytest
