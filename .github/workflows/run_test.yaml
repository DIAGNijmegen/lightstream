name: Test code and app
on:
  pull_request:
    paths:
      - lightstream/**
      - tests/**
      - .github/workflows/run_test.yaml
jobs:
  test_natten:
    name: Test optional NATTEN backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lightstream with NATTEN
        run: python -m pip install pytest --editable '.[nat]'

      - name: Run neighborhood attention tests
        run: python -m pytest tests/test_streamingneighborhoodattention.py

  test_model:
    name: Test processed code and model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        id: checkout
        uses: actions/checkout@v2

      - name: Environment setup
        uses: actions/setup-python@v2
        with:
          python-version: 3.8

      - name: Install Poetry
        uses: snok/install-poetry@v1
        
      - name: Install packages
        run: poetry install

      - name: Run tests
        run: poetry run pytest
