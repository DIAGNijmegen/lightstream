[project]
name = "lightstream"
version = "1.0.6"
description = "A Pytorch lightning framework for streaming CNN's"
authors = [
    { name = "Stephan Dooper", email = "stephan.dooper@radboudumc.nl" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/DIAGNijmegen/lightstream"
"Bug Tracker" = "https://github.com/DIAGNijmegen/lightstream/issues"


[project.optional-dependencies]
nat = [
    "torch==2.13.0",
    # The production backend is an unreleased Blackwell branch.  Pin its
    # immutable revision because the branch reports the ordinary 0.17.5
    # package version and therefore cannot be selected with `natten==...`.
    "natten @ git+https://github.com/SHI-Labs/NATTEN.git@0a6a3df544fe478e97bdd77e92fd3ec14cf43cff",
]
docs = [
    "mkdocs",
    "mkdocstrings",
    "mkdocstrings[python]",
    "mkdocs-material",
    "mkdocs-caption"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lightstream"]
